---
# Shared system prerequisites: Docker, user/group and base directories.
# Runs once per host, independent of the enabled viruses.

- name: Ensure Docker is installed
  apt:
    name:
      - docker.io
      - docker-compose
    state: present
  become: yes
  register: docker_install
  failed_when: false

- name: Start and enable Docker service
  systemd:
    name: docker
    state: started
    enabled: yes
  become: yes
  when: docker_install is succeeded

- name: Ensure srsilo group exists
  group:
    name: "{{ srsilo_group }}"
    state: present
  become: yes

- name: Ensure srsilo user exists
  user:
    name: "{{ srsilo_user }}"
    group: "{{ srsilo_group }}"
    shell: /bin/bash
    create_home: yes
    comment: "srSILO Pipeline User"
    groups: docker
    append: yes
  become: yes

- name: Ensure base directory exists
  file:
    path: "{{ srsilo_base_path }}"
    state: directory
    owner: "{{ srsilo_user }}"
    group: "{{ srsilo_group }}"
    mode: '0755'
  become: yes

- name: Ensure Ansible log directory exists
  file:
    path: /var/log/ansible
    state: directory
    owner: root
    group: adm
    mode: '0750'
  become: yes

- name: Display prerequisites complete message
  debug:
    msg:
      - "✓ Prerequisites setup complete"
      - "  User/Group: {{ srsilo_user }}:{{ srsilo_group }}"
      - "  Base path: {{ srsilo_base_path }}"
