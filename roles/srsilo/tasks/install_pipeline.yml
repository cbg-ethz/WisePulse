---
# Install the srsilo-updater pipeline code from srsilo-updater/:
#   - Rust utilities (rust/), built with cargo build --release
#   - Python package (pyproject.toml + pipeline/), installed into a venv
# Runs once per host; shared by all viruses.

- name: Ensure build dependencies are installed
  apt:
    name:
      - build-essential
      - pkg-config
      - libssl-dev
      - python3-venv
    state: present
  become: yes

# --- Rust utilities ---

- name: Check if Rust/Cargo is installed for srsilo user
  stat:
    path: "/home/{{ srsilo_user }}/.cargo/bin/cargo"
  register: cargo_bin
  become: yes

- name: Install Rust for srsilo user if not present
  shell: |
    curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
  args:
    creates: "/home/{{ srsilo_user }}/.cargo/bin/cargo"
  become: yes
  become_user: "{{ srsilo_user }}"
  when: not cargo_bin.stat.exists

- name: Ensure tools directory exists
  file:
    path: "{{ srsilo_tools_path }}"
    state: directory
    owner: "{{ srsilo_user }}"
    group: "{{ srsilo_group }}"
    mode: '0755'
  become: yes

- name: Copy Rust source files to tools path
  copy:
    src: "{{ inventory_dir }}/srsilo-updater/rust/{{ item }}"
    dest: "{{ srsilo_tools_path }}/"
    owner: "{{ srsilo_user }}"
    group: "{{ srsilo_group }}"
  become: yes
  loop:
    - Cargo.toml
    - Cargo.lock
    - src

- name: Build Rust utilities
  command: cargo build --release
  args:
    chdir: "{{ srsilo_tools_path }}"
  become: yes
  become_user: "{{ srsilo_user }}"
  environment:
    PATH: "/home/{{ srsilo_user }}/.cargo/bin:/usr/local/bin:/usr/bin:/bin"
    CARGO_HOME: "/home/{{ srsilo_user }}/.cargo"
    RUSTUP_HOME: "/home/{{ srsilo_user }}/.rustup"
  register: build_result
  changed_when: "'Compiling' in build_result.stderr or 'Finished' in build_result.stderr"

- name: Verify built binaries exist
  stat:
    path: "{{ srsilo_tools_path }}/target/release/{{ item }}"
  register: binary_checks
  loop:
    - split_into_sorted_chunks
    - merge_sorted_chunks
    - fetch_silo_data
    - check_new_data
  become: yes

- name: Report missing binaries
  fail:
    msg: "Binary {{ item.item }} was not built successfully"
  loop: "{{ binary_checks.results }}"
  when: not item.stat.exists

# --- Python package ---

- name: Create Python virtualenv for srsilo-updater
  command:
    cmd: python3 -m venv "{{ srsilo_base_path }}/venv"
    creates: "{{ srsilo_base_path }}/venv/bin/python"
  become: yes

# The source is only a build input for pip; the service runs the copy installed in the venv.
# A fresh temp dir per deploy means no removed modules or stale build/ output carry over.
- name: Install srsilo-updater package into venv
  block:
    - name: Create temp dir for srsilo-updater package source
      tempfile:
        state: directory
        suffix: srsilo-updater
      register: srsilo_updater_tmp

    - name: Copy srsilo-updater package source to remote host
      copy:
        src: "{{ inventory_dir }}/srsilo-updater/{{ item }}"
        dest: "{{ srsilo_updater_tmp.path }}/"
      loop:
        - pyproject.toml
        - pipeline

    # pip always reinstalls from a local directory, even when the version is unchanged
    - name: Install srsilo-updater package into venv
      pip:
        name: "{{ srsilo_updater_tmp.path }}"
        virtualenv: "{{ srsilo_base_path }}/venv"
  always:
    - name: Remove temp dir for srsilo-updater package source
      file:
        path: "{{ srsilo_updater_tmp.path }}"
        state: absent
  become: yes

- name: Set ownership of virtualenv
  file:
    path: "{{ srsilo_base_path }}/venv"
    owner: "{{ srsilo_user }}"
    group: "{{ srsilo_group }}"
    recurse: yes
  become: yes

- name: Display install complete message
  debug:
    msg:
      - "✓ srsilo-updater pipeline installed"
      - "  Rust binaries: {{ srsilo_tools_path }}/target/release/"
      - "  Venv: {{ srsilo_base_path }}/venv"
