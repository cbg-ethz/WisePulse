---
# The shared RhyDB instance (one table per virus) and the docker-compose
# project that runs it together with one LAPIS per enabled virus.

- name: Ensure RhyDB directories exist
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ srsilo_user }}"
    group: "{{ srsilo_group }}"
    mode: '0755'
  become: yes
  loop:
    - "{{ srsilo_rhydb_path }}"
    - "{{ srsilo_rhydb_output }}"
    - "{{ srsilo_rhydb_path }}/tmp"
    - "{{ srsilo_rhydb_path }}/logs"

- name: Deploy RhyDB schema
  copy:
    src: rhydb/schema.rhyql
    dest: "{{ srsilo_rhydb_path }}/schema.rhyql"
    owner: "{{ srsilo_user }}"
    group: "{{ srsilo_group }}"
    mode: '0644'
  become: yes

- name: Template docker-compose file
  template:
    src: docker-compose.yml.j2
    dest: "{{ srsilo_base_path }}/docker-compose.yml"
    owner: "{{ srsilo_user }}"
    group: "{{ srsilo_group }}"
    mode: '0644'
  become: yes

