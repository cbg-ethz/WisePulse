---
# Default variables for srsilo role

# =============================================================================
# Base Configuration
# =============================================================================

# Base paths
srsilo_base_path: /opt/srsilo
srsilo_tools_path: "{{ srsilo_base_path }}/tools"

# User and group
srsilo_user: srsilo
srsilo_group: srsilo

# =============================================================================
# Multi-Virus Configuration
# =============================================================================

# Virus registry - defines all supported viruses and their configurations
# Keys are used for directory names and Ansible variable references
# The 'organism' field is the exact value passed to the LAPIS API
# The 'table' field is the virus' table in the shared RhyDB instance
# The 'instance_name' field names the virus' LAPIS container (<instance_name>-lapis)
#
# To add a new virus:
#   1. Add entry here with organism and table
#   2. Add its references and table to roles/srsilo/files/rhydb/schema.rhyql
#      (prefix reference names with '<virus>_', they are global to the instance)
#   3. Only if it gets its own LAPIS: set instance_name and lapis_port, create LAPIS
#      config files in roles/srsilo/files/viruses/<virus>/ and add it to nginx.
#      Without lapis_port it is only imported into its RhyDB table.
#   4. Add to srsilo_enabled_viruses and srsilo_virus_config in group_vars when ready
#
# Note: For viruses with hyphens in API name (e.g., flu-h1), use underscore
# for the key (flu_h1) and set organism to the API value (flu-h1)
srsilo_viruses:
  covid:
    organism: covid           # API endpoint identifier
    table: data               # LAPIS' default table, kept for existing RhyDB API users
    instance_name: wise-sarsCoV2
    lapis_port: 8083
  rsva:
    organism: rsva
    table: rsva
    instance_name: wise-rsva
    lapis_port: 8084
  rsvb:
    organism: rsvb
    table: rsvb
    instance_name: wise-rsvb
    lapis_port: 8085
  flua_h3:                    # RhyDB table only, no LAPIS
    organism: flua-h3
    table: flua_h3
  flua_h1:                    # RhyDB table only, no LAPIS
    organism: flua-h1
    table: flua_h1
  flua_n1:                    # RhyDB table only, no LAPIS
    organism: flua-n1
    table: flua_n1
  flua_n2:                    # RhyDB table only, no LAPIS
    organism: flua-n2
    table: flua_n2
  flua_mp:                    # RhyDB table only, no LAPIS
    organism: flua-mp
    table: flua_mp

# List of enabled viruses (for multi-virus playbooks)
# This controls which viruses are actually processed - override in group_vars
srsilo_enabled_viruses:
  - covid
  - rsva
  - rsvb

# =============================================================================
# API Configuration
# =============================================================================

# API base URL (shared across all viruses)
srsilo_api_base_url: https://api.db.wasap.genspectrum.org

# Per-virus settings - REQUIRED in group_vars/srsilo/main.yml
# Must be defined in srsilo_virus_config for each enabled virus:
#   - fetch_days: Number of days to fetch (e.g., 90)
#   - fetch_max_reads: Max reads per batch (e.g., 172500000 for COVID)
#   - chunk_size: Chunk size for processing (e.g., 1000000 for high RAM)

# =============================================================================
# Retention Policy
# =============================================================================

srsilo_retention_days: 7
srsilo_retention_min_keep: 2

# =============================================================================
# Processing Configuration
# =============================================================================

# Per-virus configuration is loaded from group_vars/srsilo/main.yml
# See srsilo_virus_config dictionary for per-virus settings
# No defaults here - fails loudly if config missing

