name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  rust-checks:
    name: srSILO Rust Tools - Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('srsilo-updater/rust/**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('srsilo-updater/rust/**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: srsilo-updater/rust/target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('srsilo-updater/rust/**/Cargo.lock') }}
      
      - name: Check formatting
        run: cargo fmt --all -- --check
        working-directory: srsilo-updater/rust
      
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: srsilo-updater/rust
      
      - name: Build
        run: cargo build --release --workspace
        working-directory: srsilo-updater/rust
      
      - name: Test
        run: cargo test --workspace
        working-directory: srsilo-updater/rust

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python dependencies
        run: uv sync --locked --extra dev
        working-directory: srsilo-updater

      # Runs after the release build so test_e2e.py finds rust/target/release binaries
      - name: Python tests
        run: uv run --extra dev pytest -v -rs
        working-directory: srsilo-updater

