---
- name: Configure firewalld
  hosts: wisepulse_server
  become: true
  tasks:
    - name: Install firewalld
      apt:
        name: firewalld
        state: present

    - name: Open firewall services and ports
      ansible.posix.firewalld:
        zone: "{{ item.zone }}"
        service: "{{ item.service | default(omit) }}"
        port: "{{ item.port | default(omit) }}"
        permanent: true
        immediate: true
        state: enabled
      # Public traffic only reaches sshd and nginx. Backend services (LAPIS/SILO,
      # Loculus, monitoring) are proxied by nginx via 127.0.0.1 and must not be
      # exposed directly. Port 80 is needed for the HTTPS redirect and certbot renewals.
      loop:
        - { zone: public, service: ssh }
        - { zone: public, service: http }
        - { zone: public, service: https }
        - { zone: docker, service: https }
        - { zone: docker, port: 8000-9500/tcp }
