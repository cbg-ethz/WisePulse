---
# Overrides of group_vars/srsilo/main.yml for a low-memory (~8 GB RAM) test server.
#
#   ansible-playbook playbooks/srsilo/setup.yml -i inventory.ini --become --ask-become-pass \
#     -e "@playbooks/srsilo/vars/test_vars.yml"
#
# Extra vars replace a whole dict, so srsilo_viruses lists complete entries for
# the enabled viruses only.

srsilo_enabled_viruses:
  - covid
  - rsva

srsilo_viruses:
  covid:
    organism: covid
    table: data
    instance_name: wise-sarsCoV2
    lapis_port: 8083
    fetch_days: 45
    fetch_max_reads: 5_000_000
    chunk_size: 30_000
  rsva:
    organism: rsva
    table: rsva
    instance_name: wise-rsva
    lapis_port: 8084
    fetch_days: 45
    fetch_max_reads: 2_000_000
    chunk_size: 30_000

srsilo_rhydb_memory_limit: 7g         # 90% of 8GB RAM
srsilo_pipeline_memory_max: 7G

srsilo_retention_days: 3
srsilo_retention_min_keep: 2
