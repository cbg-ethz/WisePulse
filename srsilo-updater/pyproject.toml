[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "srsilo-updater"
version = "0.1.0"
requires-python = ">=3.11"  # rhydb wheels: cp311+, manylinux_2_35
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
    # Must match the RhyDB server image (serialization version), see roles/srsilo/templates/docker-compose.yml.j2
    "rhydb==0.17.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-httpserver>=1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline*"]
